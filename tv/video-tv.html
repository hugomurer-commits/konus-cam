<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konus TV</title>
<style>
  :root{--bg:#111;--fg:#eee;--muted:#999;--accent:#e4572e;--card:#1c1c1c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:16px}
  main{max-width:960px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  p{color:var(--muted);margin:0 0 16px}
  #drop{display:block;border:2px dashed #444;border-radius:10px;padding:24px;text-align:center;cursor:pointer;background:var(--card)}
  #drop.over{border-color:var(--accent)}
  canvas{width:100%;aspect-ratio:16/9;background:#000;display:block;margin:16px 0;border-radius:6px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  button,select{font:inherit;padding:10px 16px;border-radius:8px;border:0;background:#333;color:var(--fg);cursor:pointer}
  button.primary{background:var(--accent);color:#fff}
  button:disabled{opacity:.4;cursor:default}
  #status{color:var(--muted)}
  progress{width:100%;height:8px;margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>Vídeo do Instagram para a TV</h1>
  <p>Coloque o Reels (vertical). Ele aparece 3 vezes lado a lado em 1920x1080 e você baixa o arquivo pronto para a TV (sem áudio).</p>

  <label id="drop">Clique ou arraste o vídeo aqui
    <input id="file" type="file" accept="video/*" hidden>
  </label>

  <canvas id="tela" width="1920" height="1080"></canvas>

  <div class="row">
    <select id="modo">
      <option value="preencher">Preencher (sem faixas)</option>
      <option value="inteiro">Inteiro (sem cortar nada)</option>
    </select>
    <button id="gerar" class="primary" disabled>Gerar vídeo para TV</button>
    <span id="status"></span>
  </div>
  <progress id="prog" value="0" max="1" hidden></progress>
</main>

<video id="src" playsinline hidden></video>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var video = $('src'), canvas = $('tela'), ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height, PW = W / 3;
  var nome = 'video';

  // Mesmo enquadramento do video_tv.py: cada copia ocupa 640x1080.
  function desenhar(){
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (video.videoWidth){
      var vw = video.videoWidth, vh = video.videoHeight;
      var escala = $('modo').value === 'preencher'
        ? Math.max(PW / vw, H / vh) : Math.min(PW / vw, H / vh);
      var dw = vw * escala, dh = vh * escala;
      for (var i = 0; i < 3; i++){
        ctx.save();
        ctx.beginPath(); ctx.rect(i * PW, 0, PW, H); ctx.clip();
        ctx.drawImage(video, i * PW + (PW - dw) / 2, (H - dh) / 2, dw, dh);
        ctx.restore();
      }
    }
    requestAnimationFrame(desenhar);
  }
  requestAnimationFrame(desenhar);

  function carregar(f){
    if (!f) return;
    nome = f.name.replace(/\.[^.]+$/, '');
    video.src = URL.createObjectURL(f);
    video.loop = true; video.muted = true;
    video.play();
    $('gerar').disabled = false;
    $('status').textContent = f.name;
  }
  $('file').onchange = function(){ carregar(this.files[0]); };
  var drop = $('drop');
  drop.ondragover = function(e){ e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function(){ drop.classList.remove('over'); };
  drop.ondrop = function(e){ e.preventDefault(); drop.classList.remove('over'); carregar(e.dataTransfer.files[0]); };

  // MP4 (H.264) e' o que a TV toca; Chrome/Edge recentes gravam direto nele.
  function formato(){
    var tipos = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1',
                 'video/webm;codecs=vp9', 'video/webm'];
    for (var i = 0; i < tipos.length; i++) if (MediaRecorder.isTypeSupported(tipos[i])) return tipos[i];
    return '';
  }

  $('gerar').onclick = function(){
    var mime = formato(), ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    var saida = canvas.captureStream(30);
    // sem audio: so a imagem vai para a TV

    var partes = [], rec = new MediaRecorder(saida, { mimeType: mime, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = function(e){ if (e.data.size) partes.push(e.data); };
    rec.onstop = function(){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(partes, { type: mime }));
      a.download = nome + '_tv.' + ext;
      a.click();
      $('status').textContent = 'Pronto: ' + a.download + (ext === 'webm'
        ? ' (seu navegador não grava MP4 — use o Chrome atualizado para a TV aceitar)' : '');
      $('gerar').disabled = false; $('prog').hidden = true;
      video.loop = true; video.play();
    };

    $('gerar').disabled = true; $('prog').hidden = false;
    $('status').textContent = 'Gravando (leva o tempo do vídeo)...';
    video.loop = false; video.currentTime = 0;
    video.ontimeupdate = function(){ $('prog').value = video.currentTime / (video.duration || 1); };
    video.onended = function(){ if (rec.state === 'recording') rec.stop(); };
    video.play().then(function(){ rec.start(1000); });
  };
})();
</script>
</body>
</html>
