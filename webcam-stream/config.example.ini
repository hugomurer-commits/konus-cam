; Copie para config.ini (ou rode: python webcam_stream.py --configurar).
; O config.ini tem a senha e o token: ele NAO vai para o git.

[acesso]
usuario = admin
senha = troque-esta-senha

[camera]
; 0 = webcam padrao; 1, 2... = outras cameras
indice = 0
largura = 1280
altura = 720
fps = 15
qualidade_jpeg = 70

[servidor]
porta = 5000
; "sim" deixa outros PCs da rede local acessarem http://IP-DO-PC:5000
aceitar_rede_local = nao

[ngrok]
; Token em https://dashboard.ngrok.com/get-started/your-authtoken
authtoken =
; Opcional: dominio fixo gratuito (https://dashboard.ngrok.com/domains) para o link nunca mudar
dominio =
ativo = sim
